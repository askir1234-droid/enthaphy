<!DOCTYPE html>
<html lang="ko">

<body class="flex items-center justify-center min-h-screen p-4">

            <div class="space-y-4 mb-8">

                        <option value="C(7반)">C(7반)</option>

                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">학번</label>
                    <input type="text" id="id-input" placeholder="예: 20101" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">이름</label>
                    <input type="text" id="name-input" placeholder="이름을 입력하세요" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
            </div>

            <div class="text-center mt-8">
                <p class="text-gray-600 mb-6 font-bold text-lg">도전할 중단원과 난이도를 선택해주세요!</p>
                
                <div class="space-y-6 text-left">
                    <!-- 단원 1 -->
                    <div class="border border-gray-200 p-4 rounded-xl shadow-sm bg-gray-50 hover:bg-gray-100 transition-colors">
                        <h3 class="font-black text-gray-800 mb-3 border-b-2 border-yellow-300 pb-2">01. 화학 반응과 엔탈피</h3>
                        <div class="flex gap-3">
                            <button onclick="startQuiz('01. 화학 반응과 엔탈피', '하')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">

                            <button onclick="startQuiz('01. 화학 반응과 엔탈피', '상')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">
                                난이도 상<br><span class="text-sm font-medium opacity-80">(5문제)</span>
                            </button>
                        </div>
                    </div>

                    <!-- 단원 2 -->
                    <div class="border border-gray-200 p-4 rounded-xl shadow-sm bg-gray-50 hover:bg-gray-100 transition-colors">
                        <h3 class="font-black text-gray-800 mb-3 border-b-2 border-yellow-300 pb-2">02. 반응 경로와 반응 엔탈피</h3>
                        <div class="flex gap-3">
                            <button onclick="startQuiz('02. 반응 경로와 반응 엔탈피', '하')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">
                                난이도 하<br><span class="text-sm font-medium opacity-80">(5문제)</span>
                            </button>
                            <button onclick="startQuiz('02. 반응 경로와 반응 엔탈피', '상')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">
                                난이도 상<br><span class="text-sm font-medium opacity-80">(5문제)</span>
                            </button>
                        </div>
                    </div>

                    <!-- 단원 3 -->
                    <div class="border border-gray-200 p-4 rounded-xl shadow-sm bg-gray-50 hover:bg-gray-100 transition-colors">
                        <h3 class="font-black text-gray-800 mb-3 border-b-2 border-yellow-300 pb-2">03. 화학 변화의 자발성</h3>
                        <div class="flex gap-3">
                            <button onclick="startQuiz('03. 화학 변화의 자발성', '하')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">
                                난이도 하<br><span class="text-sm font-medium opacity-80">(5문제)</span>
                            </button>
                            <button onclick="startQuiz('03. 화학 변화의 자발성', '상')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">
                                난이도 상<br><span class="text-sm font-medium opacity-80">(5문제)</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Quiz Screen -->
        <div id="quiz-screen" class="p-8 hidden">
            <div class="flex justify-between items-center mb-6">
                <div class="flex flex-col gap-1">
                    <span id="subchapter-badge" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded border border-blue-400 inline-block w-max"></span>
                    <span id="difficulty-badge" class="text-xs font-bold px-2.5 py-1 rounded border inline-block w-max"></span>
                </div>
                <span class="text-gray-500 font-bold">
                    <span id="retry-badge" class="text-red-500 mr-2 hidden">[재도전]</span>

                </span>
            </div>
            
            <h2 id="question-text" class="text-xl font-bold text-gray-800 mb-6 leading-relaxed"></h2>
            
            <div id="options-container" class="space-y-3 mb-8">
                <!-- Options will be injected here -->
            </div>

            <div class="flex justify-between mt-8">
                <button id="prev-btn" onclick="prevQuestion()" class="bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-lg hover:bg-gray-300 transition-colors hidden">
                    ⟵ 이전 문제

                <button id="next-btn" onclick="nextQuestion()" class="bg-gray-300 text-gray-500 font-bold py-3 px-8 rounded-lg cursor-not-allowed ml-auto" disabled>

        </div>

        <!-- 3. Result Screen -->
        <div id="result-screen" class="p-8 hidden text-center">
            <div id="result-emoji" class="mb-4 text-6xl">🎉</div>
            <h2 id="result-title" class="text-3xl font-bold text-gray-800 mb-2">수고하셨습니다!</h2>
            <p id="student-result-info" class="text-gray-600 mb-6 font-semibold"></p>
            
            <div class="bg-yellow-50 p-6 rounded-xl mb-6 border border-yellow-200">
                <p class="text-lg text-gray-700">최종 점수</p>
                <p class="text-5xl font-black text-yellow-600 mt-2"><span id="final-score">0</span> <span class="text-2xl">/ <span id="final-total">5</span> 점</span></p>
            </div>

            <!-- 피드백 영역 -->
            <div id="feedback-container" class="text-left bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200">
                <p class="text-sm font-bold text-green-600 mb-1">✅ 맞은 문제: <span id="correct-list" class="font-normal text-gray-700"></span></p>
                <p class="text-sm font-bold text-red-500">❌ 틀린 문제: <span id="wrong-list" class="font-normal text-gray-700"></span></p>
            </div>

            <div id="submit-status" class="mb-6 p-4 rounded-lg hidden"></div>

            <div id="action-buttons" class="flex flex-col sm:flex-row gap-3 justify-center">
                <!-- Buttons will be injected dynamically based on retry status -->
            </div>
        </div>

        <!-- Custom Alert Box -->
        <div id="custom-alert" class="absolute inset-0 bg-gray-900 bg-opacity-50 hidden flex justify-center items-center z-50">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4 text-center">
                <p id="custom-alert-message" class="text-gray-800 font-medium mb-6"></p>
                <button onclick="closeAlert()" class="bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded-lg">확인</button>
            </div>
        </div>
    </div>

    <script>
        // --- 난이도 하 (기존 데이터 재구성, 각 15문제) ---
        const quizData01Low = [
            { question: "화학 반응이 일어날 때, 반응물과 생성물의 엔탈피 차이를 무엇이라고 하는가?", options: ["반응 속도", "활성화 에너지", "반응 엔탈피", "엔트로피"], correctAnswer: 2 },
            { question: "발열 반응에 대한 설명으로 옳은 것은?", options: ["주위의 온도가 낮아진다.", "반응 엔탈피(ΔH)가 0보다 작다.", "생성물의 엔탈피 합이 반응물보다 크다.", "열을 흡수하는 반응이다."], correctAnswer: 1 },
            { question: "흡열 반응에 대한 설명으로 옳은 것은?", options: ["반응 엔탈피(ΔH)가 0보다 작다.", "주위로 열을 방출한다.", "생성물이 반응물보다 에너지가 낮아 안정하다.", "생성물의 엔탈피 합이 반응물의 엔탈피 합보다 크다."], correctAnswer: 3 },
            { question: "다음 중 열을 흡수하는 흡열 반응의 예로 적절한 것은?", options: ["메테인 가스의 연소", "수산화 나트륨과 염산의 중화 반응", "냉각 팩 속 질산 암모늄의 용해", "금속 마그네슘과 산소의 반응"], correctAnswer: 2 },
            { question: "열화학 반응식에 반드시 표시해야 하는 조건이 아닌 것은?", options: ["물질의 상태", "반응 용기의 부피", "온도", "압력"], correctAnswer: 1 },
            { question: "같은 물질일 때, 상태에 따른 엔탈피의 크기를 바르게 비교한 것은?", options: ["고체 < 기체 < 액체", "고체 < 액체 < 기체", "기체 < 액체 < 고체", "액체 < 고체 < 기체"], correctAnswer: 1 },
            { question: "25℃, 1기압에서 흑연(C)이 완전 연소하여 이산화 탄소(CO₂)가 될 때 393.5 kJ의 열을 방출한다. 이 반응의 반응 엔탈피(ΔH)는?", options: ["+393.5 kJ", "-393.5 kJ", "+787.0 kJ", "-787.0 kJ"], correctAnswer: 1 },
            { question: "수소 기체(H₂) 1mol이 완전 연소할 때의 반응 엔탈피가 -285.8 kJ이다. 수소 기체 2mol이 완전 연소할 때의 열화학 반응식의 ΔH 값은?", options: ["-285.8 kJ", "+285.8 kJ", "-571.6 kJ", "+571.6 kJ"], correctAnswer: 2 },
            { question: "물질 1mol이 완전 연소할 때의 반응 엔탈피를 무엇이라 하는가?", options: ["생성 엔탈피", "분해 엔탈피", "연소 엔탈피", "용해 엔탈피"], correctAnswer: 2 },
            { question: "메테인의 연소 반응은 발열 반응이다. 반응이 일어날 때 계와 주위의 변화로 옳은 것은?", options: ["계의 엔탈피는 증가하고, 주위의 온도는 상승한다.", "계의 엔탈피는 감소하고, 주위의 온도는 상승한다.", "계의 엔탈피는 증가하고, 주위의 온도는 하락한다.", "계의 엔탈피는 감소하고, 주위의 온도는 하락한다."], correctAnswer: 1 },
            { question: "어떤 반응의 반응물이 생성물보다 에너지가 높아 안정한 상태가 되려고 열을 방출했다. 이 반응의 종류는?", options: ["흡열 반응", "발열 반응", "가역 반응", "분해 반응"], correctAnswer: 1 },
            { question: "액체 상태의 물이 기화하여 수증기가 되는 과정에서의 열 출입과 반응 종류는?", options: ["열 방출, 발열 반응", "열 방출, 흡열 반응", "열 흡수, 흡열 반응", "열 흡수, 발열 반응"], correctAnswer: 2 },
            { question: "반응물의 엔탈피 합이 생성물의 엔탈피 합보다 작은 경우, 이 반응의 반응 엔탈피(ΔH)의 부호는?", options: ["양(+)이다.", "음(-)이다.", "0이다.", "알 수 없다."], correctAnswer: 0 },
            { question: "열화학 반응식을 작성할 때 화학 반응식의 계수를 1/2배로 줄이면 반응 엔탈피(ΔH)의 크기는 어떻게 변하는가?", options: ["2배가 된다.", "변하지 않는다.", "1/2배가 된다.", "부호가 바뀐다."], correctAnswer: 2 },
            { question: "물질 1mol이 성분 원소의 가장 안정한 원소 물질로부터 생성될 때의 반응 엔탈피를 무엇이라 하는가?", options: ["연소 엔탈피", "생성 엔탈피", "분해 엔탈피", "중화 엔탈피"], correctAnswer: 1 }
        ];

        const quizData02Low = [
            { question: "화학 반응에서 반응물과 생성물의 종류와 상태가 같으면 반응 경로에 관계없이 반응 엔탈피의 총합은 일정하다는 법칙은?", options: ["질량 보존 법칙", "일정 성분비 법칙", "보일의 법칙", "헤스 법칙"], correctAnswer: 3 },
            { question: "헤스 법칙을 이용하면 어떤 값을 주로 구할 수 있는가?", options: ["반응 속도", "직접 측정하기 어려운 반응의 반응 엔탈피", "물질의 밀도", "기체의 압력"], correctAnswer: 1 },
            { question: "C(s) + O₂(g) → CO₂(g) ΔH = -393.5 kJ 이고, CO(g) + 1/2 O₂(g) → CO₂(g) ΔH = -283.0 kJ 일 때, C(s) + 1/2 O₂(g) → CO(g) 의 반응 엔탈피는?", options: ["-676.5 kJ", "-110.5 kJ", "+110.5 kJ", "+676.5 kJ"], correctAnswer: 1 },
            { question: "반응 엔탈피를 직접 측정하기 위해 실험실에서 주로 사용하는 기구는 무엇인가?", options: ["간이 열량계", "현미경", "스포이트", "분광기"], correctAnswer: 0 },
            { question: "A → B 반응의 반응 엔탈피가 +100 kJ 이고, B → C 반응의 반응 엔탈피가 -50 kJ 일 때, A → C 의 전체 반응 엔탈피는?", options: ["+150 kJ", "+50 kJ", "-50 kJ", "-150 kJ"], correctAnswer: 1 },
            { question: "화학 반응식의 모든 계수를 2배로 늘리면, 반응 엔탈피(ΔH)의 값은 어떻게 변하는가?", options: ["변하지 않는다.", "절반(1/2)이 된다.", "부호만 반대로 바뀐다.", "2배가 된다."], correctAnswer: 3 },
            { question: "정반응의 반응 엔탈피와 역반응의 반응 엔탈피의 관계로 옳은 것은?", options: ["크기와 부호가 모두 같다.", "크기는 같고 부호는 반대이다.", "크기는 다르고 부호는 같다.", "아무런 상관관계가 없다."], correctAnswer: 1 },
            { question: "고체 수산화 나트륨을 물에 녹인 후 염산과 반응시키는 경로(1)와 고체 수산화 나트륨을 직접 염산과 반응시키는 경로(2)의 전체 반응 엔탈피 합은 어떠한가?", options: ["경로(1)이 더 크다.", "경로(2)가 더 크다.", "두 경로의 반응 엔탈피 합은 같다.", "온도에 따라 어느 한쪽이 커진다."], correctAnswer: 2 },
            { question: "헤스 법칙을 부르는 또 다른 이름은 무엇인가?", options: ["총열량 불변 법칙", "엔트로피 증가 법칙", "작용 반작용 법칙", "질량 작용의 법칙"], correctAnswer: 0 },
            { question: "간이 열량계로 수산화 나트륨과 염산의 중화 열을 측정하려고 한다. 열량계 내부 용액의 온도가 높아졌다면 이 반응은 무슨 반응인가?", options: ["흡열 반응", "발열 반응", "흡광 반응", "무열 반응"], correctAnswer: 1 },
            { question: "다음 중 헤스 법칙의 기본 전제가 되는 열역학 법칙은 무엇인가?", options: ["열역학 제0법칙 (열평형)", "열역학 제1법칙 (에너지 보존)", "열역학 제2법칙 (엔트로피 증가)", "열역학 제3법칙 (절대 영도)"], correctAnswer: 1 },

            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            if (currentQuestionIndex === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (currentQuestionIndex === currentQuizData.length - 1) {
                nextBtn.innerText = "제출하기 ✅";
                nextBtn.classList.replace('text-gray-500', 'text-white');
            } else {
                nextBtn.innerText = "다음 문제 ➔";
            }

            if (userAnswers[currentQuestionIndex] !== null) {
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-gray-300', 'text-gray-500');
                if (currentQuestionIndex === currentQuizData.length - 1) {
                    nextBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'text-white');
                    nextBtn.classList.remove('bg-yellow-400', 'hover:bg-yellow-500');
                } else {
                    nextBtn.classList.add('bg-yellow-400', 'hover:bg-yellow-500', 'text-white');
                    nextBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                }
                nextBtn.style.cursor = 'pointer';
            } else {
                nextBtn.disabled = true;
                nextBtn.classList.remove('bg-yellow-400', 'hover:bg-yellow-500', 'bg-green-500', 'hover:bg-green-600', 'text-white');
                nextBtn.classList.add('bg-gray-300', 'text-gray-500');
                nextBtn.style.cursor = 'not-allowed';
            }

            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            
            const qData = currentQuizData[currentQuestionIndex];
            
            let qText = qData.question.replace(/^\d+\.\s*/, '');
            const formattedQuestion = `${currentQuestionIndex + 1}. ${qText}`.replace(/\n/g, '<br>');
            document.getElementById('question-text').innerHTML = formattedQuestion;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 border-2 border-gray-200 rounded-xl hover:bg-blue-50 transition-colors duration-200 font-medium text-gray-700';
                btn.innerText = opt;
                
                if (userAnswers[currentQuestionIndex] === index) {
                    btn.classList.add('selected-option');
                }
                
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, btnElement) {
            userAnswers[currentQuestionIndex] = index;
            
            const options = document.getElementById('options-container').children;
            for(let i=0; i<options.length; i++) {
                options[i].classList.remove('selected-option');
            }
            
            btnElement.classList.add('selected-option');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            if (currentQuestionIndex === currentQuizData.length - 1) {
                nextBtn.classList.remove('bg-gray-300', 'text-gray-500', 'bg-yellow-400', 'hover:bg-yellow-500');
                nextBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'text-white');
            } else {
                nextBtn.classList.remove('bg-gray-300', 'text-gray-500', 'bg-green-500', 'hover:bg-green-600');
                nextBtn.classList.add('bg-yellow-400', 'hover:bg-yellow-500', 'text-white');
            }
            nextBtn.style.cursor = 'pointer';
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;

            if(currentQuestionIndex < currentQuizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            let currentScore = 0;
            let currentWrong = []; 
            let currentCorrect = [];
            
            for(let i=0; i<currentQuizData.length; i++) {
                if(userAnswers[i] === currentQuizData[i].correctAnswer) {
                    currentScore++;
                    currentCorrect.push(i + 1);
                } else {
                    currentWrong.push(i + 1);
                    if(!isRetryMode) {
                        wrongQuestionsList.push(currentQuizData[i]);
                    }
                }
            }

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('student-result-info').innerText = 
                `${studentInfo.className} ${studentInfo.id} ${studentInfo.name} 학생`;
            
            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-total').innerText = currentQuizData.length;

            const titleEl = document.getElementById('result-title');
            const emojiEl = document.getElementById('result-emoji');
            const feedbackContainer = document.getElementById('feedback-container');
            const correctListEl = document.getElementById('correct-list');
            const wrongListEl = document.getElementById('wrong-list');
            const btnContainer = document.getElementById('action-buttons');
            
            btnContainer.innerHTML = ''; 

            if(!isRetryMode) {
                originalScore = currentScore;
                
                correctListEl.innerText = currentCorrect.length > 0 ? currentCorrect.join(', ') + "번" : "없음";
                wrongListEl.innerText = currentWrong.length > 0 ? currentWrong.join(', ') + "번" : "없음";
                feedbackContainer.classList.remove('hidden');

                if(currentScore === currentQuizData.length) {
                    titleEl.innerText = "완벽합니다! 백점!";
                    emojiEl.innerText = "🏆";
                    
                    btnContainer.innerHTML = `
                        <button onclick="submitToGoogleSheet()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            구글 시트로 점수 전송
                        </button>
                        <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            처음부터 다시 풀기
                        </button>
                    `;
                } else {
                    titleEl.innerText = "수고하셨습니다!";
                    emojiEl.innerText = "👏";
                    
                    btnContainer.innerHTML = `
                        <button onclick="startRetry()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            틀린 문제만 재도전 👊
                        </button>
                        <button onclick="submitToGoogleSheet()" class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            현재 점수 전송하기
                        </button>
                    `;
                }
            } else {
                feedbackContainer.classList.add('hidden'); 
                
                if(currentScore === currentQuizData.length) {
                    isRetrySuccess = true;
                    titleEl.innerText = "재도전 성공!";
                    emojiEl.innerText = "🔥";
                    document.getElementById('student-result-info').innerText += ` (틀린 문제 모두 극복!)`;
                } else {
                    titleEl.innerText = "재도전 완료!";
                    emojiEl.innerText = "💪";
                    document.getElementById('student-result-info').innerText += ` (아쉽지만 조금 더 복습해봐요!)`;
                }

                btnContainer.innerHTML = `
                    <button onclick="submitToGoogleSheet()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                        최종 결과 시트로 전송
                    </button>
                    <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                        처음부터 다시 풀기
                    </button>
                `;
            }
        }

        function startRetry() {
            isRetryMode = true;
            currentQuizData = [...wrongQuestionsList]; 
            userAnswers = new Array(currentQuizData.length).fill(null);
            currentQuestionIndex = 0;
            
            document.getElementById('total-question-num').innerText = currentQuizData.length;
            document.getElementById('retry-badge').classList.remove('hidden');
            
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            loadQuestion();
        }

        function submitToGoogleSheet() {
            const statusDiv = document.getElementById('submit-status');
            statusDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            statusDiv.classList.add('bg-blue-100', 'text-blue-800');
            statusDiv.innerText = "전송 중입니다... 잠시만 기다려주세요.";
            statusDiv.scrollIntoView({ behavior: 'smooth' });

            const totalQuestionsCount = 5; // 난이도 무관 5문제
            const scoreText = `${originalScore} / ${totalQuestionsCount}`;
            
            // 재도전 상태 텍스트 결정
            let retryStatusText = "-";
            if (originalScore === totalQuestionsCount) {
                retryStatusText = "1차 만점 통과";
            } else if (isRetryMode) {
                retryStatusText = isRetrySuccess ? "달성 (최종 만점)" : "미달성";
            } else {
                retryStatusText = "재도전 안 함";
            }

            const payload = {
                chapter: "3. 화학 변화의 자발성",
                className: studentInfo.className,
                id: studentInfo.id,
                name: studentInfo.name,
                subChapter: studentInfo.subChapter,
                difficulty: studentInfo.difficulty,
                score: scoreText,
                retryStatus: retryStatusText
            };

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusDiv.classList.replace('bg-blue-100', 'bg-green-100');
                statusDiv.classList.replace('text-blue-800', 'text-green-800');
                statusDiv.innerText = "✅ 선생님의 구글 시트로 결과가 성공적으로 전송되었습니다!";
                
                document.getElementById('action-buttons').innerHTML = `
                    <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors">
                        처음 화면으로 돌아가기
                    </button>
                `;
            })
            .catch(error => {
                statusDiv.classList.replace('bg-blue-100', 'bg-red-100');
                statusDiv.classList.replace('text-blue-800', 'text-red-800');
                statusDiv.innerText = "❌ 전송에 실패했습니다. 네트워크 연결을 확인해주세요.";
                console.error('Error!', error.message);
            });
        }
    </script>
</body>
</html>
