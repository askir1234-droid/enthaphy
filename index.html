<body class="flex items-center justify-center min-h-screen p-4">

            <div class="text-center mt-8">

                    <!-- 단원 2 -->
                    <div class="border border-gray-200 p-4 rounded-xl shadow-sm bg-gray-50 hover:bg-gray-100 transition-colors">

                        <div class="flex gap-3">
                            <button onclick="startQuiz('02. 반응 경로와 반응 엔탈피', '하')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">

                    <!-- 단원 3 -->

                        <div class="flex gap-3">
                            <button onclick="startQuiz('03. 화학 변화의 자발성', '하')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">

                            </button>
                            <button onclick="startQuiz('03. 화학 변화의 자발성', '상')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-2 rounded-lg shadow transition-transform transform hover:-translate-y-1">

        <!-- 2. Quiz Screen -->
        <div id="quiz-screen" class="p-8 hidden">

                <p class="text-sm font-bold text-red-500">❌ 틀린 문제: <span id="wrong-list" class="font-normal text-gray-700"></span></p>
            </div>

            <div id="submit-status" class="mb-6 p-4 rounded-lg hidden"></div>

            <div id="action-buttons" class="flex flex-col sm:flex-row gap-3 justify-center">
                <!-- Buttons will be injected dynamically based on retry status -->
            </div>
        </div>

        <!-- Custom Alert Box -->
        <div id="custom-alert" class="absolute inset-0 bg-gray-900 bg-opacity-50 hidden flex justify-center items-center z-50">
            <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4 text-center">
                <p id="custom-alert-message" class="text-gray-800 font-medium mb-6"></p>
                <button onclick="closeAlert()" class="bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded-lg">확인</button>
            </div>
        </div>
    </div>

    <script>
        // --- 01. 화학 반응과 엔탈피 (난이도 하) 20문제 ---
        const quizData01Low = [
            { question: "일정한 압력과 온도에서 물질이 가지는 고유한 에너지를 무엇이라고 하는가?", options: ["반응 속도", "활성화 에너지", "엔탈피", "엔트로피"], correctAnswer: 2 },
            { question: "화학 반응에서 반응물과 생성물의 엔탈피 차이를 무엇이라고 하는가?", options: ["반응 엔탈피", "생성 엔탈피", "연소 엔탈피", "결합 에너지"], correctAnswer: 0 },
            { question: "발열 반응에 대한 설명으로 옳은 것은?", options: ["반응 엔탈피(ΔH)가 양(+)이다.", "주위의 온도가 낮아진다.", "생성물의 엔탈피가 반응물의 엔탈피보다 크다.", "열을 방출하는 반응이다."], correctAnswer: 3 },
            { question: "흡열 반응이 일어날 때 계와 주위의 변화로 옳은 것은?", options: ["계의 엔탈피는 증가하고 주위의 온도는 낮아진다.", "계의 엔탈피는 감소하고 주위의 온도는 낮아진다.", "계의 엔탈피는 증가하고 주위의 온도는 높아진다.", "계의 엔탈피는 감소하고 주위의 온도는 높아진다."], correctAnswer: 0 },
            { question: "다음 중 발열 반응의 예로 가장 적절한 것은?", options: ["수산화 나트륨과 염산의 중화 반응", "질산 암모늄의 물에 대한 용해", "탄산 칼슘의 열분해", "물의 전기 분해"], correctAnswer: 0 },
            { question: "열화학 반응식을 나타낼 때 반드시 표시해야 하는 물질의 조건은 무엇인가?", options: ["물질의 밀도", "물질의 질량", "물질의 상태(고체, 액체, 기체)", "물질의 부피"], correctAnswer: 2 },
            { question: "같은 종류의 물질일 때, 상태에 따른 엔탈피의 크기를 바르게 비교한 것은?", options: ["고체 < 기체 < 액체", "고체 < 액체 < 기체", "기체 < 액체 < 고체", "액체 < 고체 < 기체"], correctAnswer: 1 },
            { question: "발열 반응의 엔탈피 다이어그램에서 반응물과 생성물의 위치는 어떠한가?", options: ["반응물이 생성물보다 위에 있다.", "생성물이 반응물보다 위에 있다.", "반응물과 생성물이 같은 높이에 있다.", "온도에 따라 위치가 수시로 변한다."], correctAnswer: 0 },
            { question: "물질 1mol이 완전 연소할 때의 반응 엔탈피를 무엇이라 하는가?", options: ["용해 엔탈피", "생성 엔탈피", "중화 엔탈피", "연소 엔탈피"], correctAnswer: 3 },
            { question: "반응물의 엔탈피 합이 생성물의 엔탈피 합보다 작을 때 반응 엔탈피(ΔH)의 부호는?", options: ["양(+)이다.", "음(-)이다.", "0이다.", "알 수 없다."], correctAnswer: 0 },
            { question: "어떤 반응이 일어날 때 주변의 열을 흡수하여 반응 용기가 차가워졌다. 이 반응의 반응 엔탈피(ΔH) 부호는?", options: ["양(+)이다.", "음(-)이다.", "0이다.", "계산할 수 없다."], correctAnswer: 0 },
            { question: "열화학 반응식에서 반응하는 물질의 양(계수)이 2배가 되면 반응 엔탈피(ΔH)의 크기는 어떻게 변하는가?", options: ["1/2배가 된다.", "변하지 않는다.", "2배가 된다.", "부호가 반대로 바뀐다."], correctAnswer: 2 },
            { question: "탄산 칼슘(CaCO3) 고체가 분해되어 산화 칼슘(CaO)과 이산화 탄소(CO2)가 될 때 열을 흡수한다. 이 반응의 종류는?", options: ["가역 반응", "발열 반응", "흡열 반응", "연소 반응"], correctAnswer: 2 },
            { question: "열화학 반응식에서 ΔH = -393.5 kJ 이라면 이 반응은 무슨 반응을 의미하는가?", options: ["393.5 kJ의 열을 흡수하는 흡열 반응", "393.5 kJ의 열을 방출하는 발열 반응", "엔탈피가 393.5 kJ 증가하는 반응", "주위 온도를 낮추는 반응"], correctAnswer: 1 },
            { question: "연소 반응의 열역학적 특징으로 옳은 것은?", options: ["항상 흡열 반응이다.", "항상 발열 반응이다.", "엔탈피가 증가하는 반응이다.", "반응 엔탈피가 0보다 크다."], correctAnswer: 1 },
            { question: "수소 자동차의 연료인 수소 기체가 연소될 때 가장 큰 장점은 무엇인가?", options: ["연소 엔탈피가 매우 작아 안전하다.", "이산화 탄소가 발생하지 않는 친환경 연료이다.", "저장과 운송이 매우 쉽다.", "상온에서 액체 상태로 존재한다."], correctAnswer: 1 },
            { question: "냉각 팩에 들어있는 질산 암모늄이 물에 녹는 과정의 열 출입과 반응 종류는?", options: ["열 방출, 발열 반응", "열 방출, 흡열 반응", "열 흡수, 발열 반응", "열 흡수, 흡열 반응"], correctAnswer: 3 },
            { question: "다음 중 주위의 온도가 상승하는 변화는 무엇인가?", options: ["얼음이 녹아 물이 될 때", "물이 증발하여 수증기가 될 때", "염산과 수산화 나트륨 수용액이 섞일 때", "드라이아이스가 승화할 때"], correctAnswer: 2 },
            { question: "반응 엔탈피(ΔH)를 구하는 공식으로 옳은 것은?", options: ["(생성물의 엔탈피 합) - (반응물의 엔탈피 합)", "(반응물의 엔탈피 합) - (생성물의 엔탈피 합)", "(생성물의 엔탈피 합) + (반응물의 엔탈피 합)", "(반응물의 엔탈피 합) / (생성물의 엔탈피 합)"], correctAnswer: 0 },
            { question: "정반응의 반응 엔탈피가 +100 kJ 이라면 역반응의 반응 엔탈피는 얼마인가?", options: ["+100 kJ", "+50 kJ", "-50 kJ", "-100 kJ"], correctAnswer: 3 }
        ];

        // --- 01. 화학 반응과 엔탈피 (난이도 상) 20문제 ---
        const quizData01High = [
            { question: "[모의고사 기출] 그림은 흑연(C) 1mol이 연소하여 이산화 탄소(CO2)가 될 때 엔탈피가 393.5 kJ 감소하는 상태 변화 그래프이다. 이 반응에 대한 설명으로 옳은 것은?", options: ["주위의 온도가 낮아진다.", "393.5 kJ의 열을 흡수하는 반응이다.", "생성물의 엔탈피 합이 반응물보다 크다.", "반응 후 주위의 온도가 상승한다."], correctAnswer: 3 },
            { question: "[모의고사 기출] 열화학 반응식 H2(g) + 1/2 O2(g) → H2O(l) ΔH = -285.8 kJ 이다. 물(H2O) 2mol이 전기 분해되어 H2(g)와 O2(g)로 분해될 때의 반응 엔탈피(ΔH)는?", options: ["-571.6 kJ", "-285.8 kJ", "+285.8 kJ", "+571.6 kJ"], correctAnswer: 3 },
            { question: "[교과서 탐구] 메테인(CH4)의 몰당 연소 엔탈피가 -890 kJ이다. 메테인 8g이 완전 연소할 때 방출하는 열량은? (단, 메테인의 분자량은 16이다.)", options: ["222.5 kJ", "445 kJ", "890 kJ", "1780 kJ"], correctAnswer: 1 },

        // --- 상태 변수 ---
        let currentQuestionIndex = 0;

        let currentQuizData = []; 
        let userAnswers = []; 
        let isRetryMode = false;
        let wrongQuestionsList = []; 
        let isRetrySuccess = false; 

        // --- 구글 시트 연동 웹앱 URL ---
        const scriptUrl = "https://script.google.com/macros/s/AKfycbz9pDJjouMn6TM9mYvgWzNp7gWbMvzzr08NRJLWxL1RAWBWUQO_7QMg8NmOW2Yc5Uyhpw/exec"; 

        function showAlert(message) {
            document.getElementById('custom-alert-message').innerText = message;
            document.getElementById('custom-alert').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startQuiz(subChapter, difficulty) {
            const classInput = document.getElementById('class-input').value.trim();
            const idInput = document.getElementById('id-input').value.trim();
            const nameInput = document.getElementById('name-input').value.trim();

            if(!classInput || !idInput || !nameInput) {
                showAlert("분반, 학번, 이름을 모두 입력해주세요.");
                return;
            }

            studentInfo.className = classInput;
            studentInfo.id = idInput;
            studentInfo.name = nameInput;
            studentInfo.subChapter = subChapter;
            studentInfo.difficulty = difficulty;
            
            let selectedPool = [];
            let questionsCount = 5; // 난이도 무관하게 매 퀴즈마다 5문제 출제

            // 중단원 및 난이도별 데이터 풀 선택
            if(subChapter === '01. 화학 반응과 엔탈피') {
                selectedPool = difficulty === '하' ? quizData01Low : quizData01High;
            } else if (subChapter === '02. 반응 경로와 반응 엔탈피') {
                selectedPool = difficulty === '하' ? quizData02Low : quizData02High;
            } else if (subChapter === '03. 화학 변화의 자발성') {
                selectedPool = difficulty === '하' ? quizData03Low : quizData03High;
            }

            // 문제 랜덤 섞기 및 5문제 추출
            currentQuizData = shuffleArray(selectedPool).slice(0, questionsCount);
            
            userAnswers = new Array(currentQuizData.length).fill(null);
            currentQuestionIndex = 0;
            originalScore = 0;
            isRetryMode = false;
            isRetrySuccess = false;
            wrongQuestionsList = [];

            // UI 배지 설정
            document.getElementById('total-question-num').innerText = currentQuizData.length;
            document.getElementById('subchapter-badge').innerText = subChapter;
            
            const diffBadge = document.getElementById('difficulty-badge');
            diffBadge.innerText = `난이도 ${difficulty}`;
            if(difficulty === '하') {
                diffBadge.className = "text-xs font-bold px-2.5 py-1 rounded border inline-block w-max bg-green-100 text-green-800 border-green-400";
            } else {
                diffBadge.className = "text-xs font-bold px-2.5 py-1 rounded border inline-block w-max bg-red-100 text-red-800 border-red-400";
            }
            
            document.getElementById('retry-badge').classList.add('hidden');
            
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            if (currentQuestionIndex === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (currentQuestionIndex === currentQuizData.length - 1) {
                nextBtn.innerText = "제출하기 ✅";
                nextBtn.classList.replace('text-gray-500', 'text-white');
            } else {
                nextBtn.innerText = "다음 문제 ➔";
            }

            if (userAnswers[currentQuestionIndex] !== null) {
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-gray-300', 'text-gray-500');
                if (currentQuestionIndex === currentQuizData.length - 1) {
                    nextBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'text-white');
                    nextBtn.classList.remove('bg-yellow-400', 'hover:bg-yellow-500');
                } else {
                    nextBtn.classList.add('bg-yellow-400', 'hover:bg-yellow-500', 'text-white');
                    nextBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                }
                nextBtn.style.cursor = 'pointer';
            } else {
                nextBtn.disabled = true;
                nextBtn.classList.remove('bg-yellow-400', 'hover:bg-yellow-500', 'bg-green-500', 'hover:bg-green-600', 'text-white');
                nextBtn.classList.add('bg-gray-300', 'text-gray-500');
                nextBtn.style.cursor = 'not-allowed';
            }

            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            
            const qData = currentQuizData[currentQuestionIndex];
            
            let qText = qData.question.replace(/^\d+\.\s*/, '');
            const formattedQuestion = `${currentQuestionIndex + 1}. ${qText}`.replace(/\n/g, '<br>');
            document.getElementById('question-text').innerHTML = formattedQuestion;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 border-2 border-gray-200 rounded-xl hover:bg-blue-50 transition-colors duration-200 font-medium text-gray-700';
                btn.innerText = opt;
                
                if (userAnswers[currentQuestionIndex] === index) {
                    btn.classList.add('selected-option');
                }
                
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, btnElement) {
            userAnswers[currentQuestionIndex] = index;
            
            const options = document.getElementById('options-container').children;
            for(let i=0; i<options.length; i++) {
                options[i].classList.remove('selected-option');
            }
            
            btnElement.classList.add('selected-option');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            if (currentQuestionIndex === currentQuizData.length - 1) {
                nextBtn.classList.remove('bg-gray-300', 'text-gray-500', 'bg-yellow-400', 'hover:bg-yellow-500');
                nextBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'text-white');
            } else {
                nextBtn.classList.remove('bg-gray-300', 'text-gray-500', 'bg-green-500', 'hover:bg-green-600');
                nextBtn.classList.add('bg-yellow-400', 'hover:bg-yellow-500', 'text-white');
            }
            nextBtn.style.cursor = 'pointer';
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;

            if(currentQuestionIndex < currentQuizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            let currentScore = 0;
            let currentWrong = []; 
            let currentCorrect = [];
            
            for(let i=0; i<currentQuizData.length; i++) {
                if(userAnswers[i] === currentQuizData[i].correctAnswer) {
                    currentScore++;
                    currentCorrect.push(i + 1);
                } else {
                    currentWrong.push(i + 1);
                    if(!isRetryMode) {
                        wrongQuestionsList.push(currentQuizData[i]);
                    }
                }
            }

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('student-result-info').innerText = 
                `${studentInfo.className} ${studentInfo.id} ${studentInfo.name} 학생`;
            
            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-total').innerText = currentQuizData.length;

            const titleEl = document.getElementById('result-title');
            const emojiEl = document.getElementById('result-emoji');
            const feedbackContainer = document.getElementById('feedback-container');
            const correctListEl = document.getElementById('correct-list');
            const wrongListEl = document.getElementById('wrong-list');
            const btnContainer = document.getElementById('action-buttons');
            
            btnContainer.innerHTML = ''; 

            if(!isRetryMode) {
                originalScore = currentScore;
                
                correctListEl.innerText = currentCorrect.length > 0 ? currentCorrect.join(', ') + "번" : "없음";
                wrongListEl.innerText = currentWrong.length > 0 ? currentWrong.join(', ') + "번" : "없음";
                feedbackContainer.classList.remove('hidden');

                if(currentScore === currentQuizData.length) {
                    titleEl.innerText = "완벽합니다! 백점!";
                    emojiEl.innerText = "🏆";
                    
                    btnContainer.innerHTML = `
                        <button onclick="submitToGoogleSheet()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            구글 시트로 점수 전송
                        </button>
                        <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            처음부터 다시 풀기
                        </button>
                    `;
                } else {
                    titleEl.innerText = "수고하셨습니다!";
                    emojiEl.innerText = "👏";
                    
                    btnContainer.innerHTML = `
                        <button onclick="startRetry()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            틀린 문제만 재도전 👊
                        </button>
                        <button onclick="submitToGoogleSheet()" class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                            현재 점수 전송하기
                        </button>
                    `;
                }
            } else {
                feedbackContainer.classList.add('hidden'); 
                
                if(currentScore === currentQuizData.length) {
                    isRetrySuccess = true;
                    titleEl.innerText = "재도전 성공!";
                    emojiEl.innerText = "🔥";
                    document.getElementById('student-result-info').innerText += ` (틀린 문제 모두 극복!)`;
                } else {
                    titleEl.innerText = "재도전 완료!";
                    emojiEl.innerText = "💪";
                    document.getElementById('student-result-info').innerText += ` (아쉽지만 조금 더 복습해봐요!)`;
                }

                btnContainer.innerHTML = `
                    <button onclick="submitToGoogleSheet()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                        최종 결과 시트로 전송
                    </button>
                    <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto">
                        처음부터 다시 풀기
                    </button>
                `;
            }
        }

        function startRetry() {
            isRetryMode = true;
            currentQuizData = [...wrongQuestionsList]; 
            userAnswers = new Array(currentQuizData.length).fill(null);
            currentQuestionIndex = 0;
            
            document.getElementById('total-question-num').innerText = currentQuizData.length;
            document.getElementById('retry-badge').classList.remove('hidden');
            
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            loadQuestion();
        }

        function submitToGoogleSheet() {
            const statusDiv = document.getElementById('submit-status');
            statusDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            statusDiv.classList.add('bg-blue-100', 'text-blue-800');
            statusDiv.innerText = "전송 중입니다... 잠시만 기다려주세요.";
            statusDiv.scrollIntoView({ behavior: 'smooth' });

            const totalQuestionsCount = 5; // 난이도 무관 매번 5문제 출제
            const scoreText = `${originalScore} / ${totalQuestionsCount}`;
            
            // 재도전 상태 텍스트 결정
            let retryStatusText = "-";
            if (originalScore === totalQuestionsCount) {
                retryStatusText = "1차 만점 통과";
            } else if (isRetryMode) {
                retryStatusText = isRetrySuccess ? "달성 (최종 만점)" : "미달성";
            } else {
                retryStatusText = "재도전 안 함";
            }

            const payload = {
                chapter: "3. 화학 변화의 자발성",
                className: studentInfo.className,
                id: studentInfo.id,
                name: studentInfo.name,
                subChapter: studentInfo.subChapter,
                difficulty: studentInfo.difficulty,
                score: scoreText,
                retryStatus: retryStatusText
            };

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusDiv.classList.replace('bg-blue-100', 'bg-green-100');
                statusDiv.classList.replace('text-blue-800', 'text-green-800');
                statusDiv.innerText = "✅ 선생님의 구글 시트로 결과가 성공적으로 전송되었습니다!";
                
                document.getElementById('action-buttons').innerHTML = `
                    <button onclick="location.reload()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors">
                        처음 화면으로 돌아가기
                    </button>
                `;
            })
            .catch(error => {
                statusDiv.classList.replace('bg-blue-100', 'bg-red-100');
                statusDiv.classList.replace('text-blue-800', 'text-red-800');
                statusDiv.innerText = "❌ 전송에 실패했습니다. 네트워크 연결을 확인해주세요.";
                console.error('Error!', error.message);
            });
        }
    </script>
</body>
</html>
